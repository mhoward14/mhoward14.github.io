# ============================================================
# Continuous Integration
# Runs the site check on every pull request (and on master after a
# merge): local links resolve, every page carries the same strict
# Content Security Policy, there is no inline code the CSP would block,
# new-tab links use rel="noopener", and the contact address is never
# in plain text. It also checks .well-known/security.txt (RFC 9116) and
# fails once it is within 30 days of expiring. A weekly run means that
# failure arrives as a notification before the file lapses, even when no
# pull request is open. See .github/scripts/check_site.py.
# ============================================================

name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "41 6 * * 1" # Mondays 06:41 UTC

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-check:
    name: Site check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check pages, links, and security policy
        run: python3 .github/scripts/check_site.py
