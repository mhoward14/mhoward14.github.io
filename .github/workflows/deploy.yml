name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

# Least-privilege for what this job actually does: peaceiris/actions-gh-pages
# pushes the built site to the gh-pages branch, which needs contents: write.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v3.9.3 (latest v3)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          cname: mhoward14.github.io
